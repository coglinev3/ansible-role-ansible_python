---
name: Build

# Controls when the workflow will run
'on':
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

defaults:
  run:
    working-directory: 'coglinev3.ansible_python'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6
        with:
          path: 'coglinev3.ansible_python'

      - name: Install test dependencies.
        run: python3 -m pip install --user ansible ansible-lint

      - name: Lint code with ansible-lint.
        run: ansible-lint

  # Test the Ansible role with Molecule
  test:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: coglinev3/alpine
            distro_version: '3.14'
          - distro: coglinev3/alpine
            distro_version: '3.15'
          - distro: coglinev3/alpine
            distro_version: '3.16'
          - distro: coglinev3/alpine
            distro_version: '3.17'
          - distro: coglinev3/alpine
            distro_version: '3.18'
          - distro: coglinev3/alpine
            distro_version: '3.19'
          - distro: amazonlinux
            distro_version: '2023'
          - distro: almalinux
            distro_version: '9'
          - distro: debian
            distro_version: '11'
          - distro: debian
            distro_version: '12'
          - distro: fedora
            distro_version: '40'
          - distro: fedora
            distro_version: '41'
          - distro: fedora
            distro_version: '42'
          - distro: ubuntu
            distro_version: '22.04'
          - distro: ubuntu
            distro_version: '24.04'

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6
        with:
          path: coglinev3.ansible_python

      - name: Install Molecule
        run: >-
          python3 -m pip install --user ansible
          molecule
          molecule-plugins[docker]

      - name: Configure Ansible
        run: |
          mkdir -p ~/.ansible
          cp .github/ansible.cfg ~/.ansible.cfg
          cp .github/hosts ~/.ansible/hosts

      - name: Show Ansible and Molecule version
        run: |
          ansible --version
          molecule --version

      - name: Run tests.
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_DISTRO_VERSION: ${{ matrix.distro_version }}

  # Push Ansible role to Ansible Galaxy
  release:
    name: Release
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: galaxy
        uses: robertdebock/galaxy-action@1.2.0
        with:
          galaxy_api_key: ${{ secrets.galaxy_api_key }}
